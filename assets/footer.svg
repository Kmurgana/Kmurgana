<svg xmlns="http://www.w3.org/2000/svg" width="960" height="56" viewBox="0 0 960 56" role="img" aria-label="End of transmission">
<title>End of transmission</title>
<defs>
  <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF" stop-opacity="0"/><stop offset=".25" stop-color="#00E5FF"/><stop offset=".6" stop-color="#A78BFA"/><stop offset=".85" stop-color="#FF2E9A"/><stop offset="1" stop-color="#FF2E9A" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:11px;letter-spacing:3px;fill:#6B7F95}</style>
<rect x="40" y="19" width="880" height="1.5" rx=".75" fill="url(#ln)" opacity=".85"/>
<circle cy="19.75" r="3" fill="#FFFFFF" filter="url(#glow)">
  <animate attributeName="cx" values="40;920" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="5s" repeatCount="indefinite"/>
</circle>
<text x="480" y="44" text-anchor="middle">// END OF TRANSMISSION</text>
</svg>
