<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="Kevin Murgana — Sr. Data Scientist · Machine Learning · NLP · GenAI">
<title>Kevin Murgana — Sr. Data Scientist · Machine Learning · NLP · GenAI</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0E14"/><stop offset=".6" stop-color="#0F1621"/><stop offset="1" stop-color="#150F26"/></linearGradient>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00E5FF" stop-opacity=".9"/><stop offset=".55" stop-color="#A78BFA" stop-opacity=".55"/><stop offset="1" stop-color="#FF2E9A" stop-opacity=".9"/></linearGradient>
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00E5FF"/><stop offset=".55" stop-color="#A78BFA"/><stop offset="1" stop-color="#FF2E9A"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00E5FF" stop-opacity="0"/><stop offset=".5" stop-color="#00E5FF" stop-opacity=".16"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1E2A3A" stroke-width=".7" opacity=".6"/></pattern>
  <radialGradient id="halo" cx=".78" cy=".5" r=".45"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="clip"><rect x="1.5" y="1.5" width="957" height="237" rx="17"/></clipPath>
</defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}
.boot{font-size:13px;fill:#7CFFB2;letter-spacing:1px}
.name{font-size:50px;font-weight:800;letter-spacing:3px;fill:url(#nm)}
.role{font-size:21px;fill:#C9D6E2;letter-spacing:1px}
.geo{font-size:11px;fill:#6B7F95;letter-spacing:3px}
</style>

<rect x=".75" y=".75" width="958.5" height="238.5" rx="18" fill="url(#bg)"/>
<g clip-path="url(#clip)">
  <rect width="960" height="240" fill="url(#grid)"/>
  <rect width="960" height="240" fill="url(#halo)"/>
  <rect x="0" y="-60" width="960" height="60" fill="url(#scan)">
    <animate attributeName="y" values="-60;240" dur="6s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x=".75" y=".75" width="958.5" height="238.5" rx="18" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<path d="M18 40V22a4 4 0 0 1 4-4h18M942 40V22a4 4 0 0 0-4-4h-18M18 200v18a4 4 0 0 0 4 4h18M942 200v18a4 4 0 0 1-4 4h-18" fill="none" stroke="#00E5FF" stroke-width="1.8" opacity=".8"/>

<!-- neural net -->
<g id="net" transform="translate(0,0)">
  <g stroke="#00E5FF" stroke-opacity=".22" stroke-width="1" fill="none">
    <path d="M665 84L745 66M665 84L745 102M665 84L745 138M665 84L745 174"/>
    <path d="M665 120L745 66M665 120L745 102M665 120L745 138M665 120L745 174"/>
    <path d="M665 156L745 66M665 156L745 102M665 156L745 138M665 156L745 174"/>
