    <path d="M665 156L745 102" stroke="#00E5FF"><animate attributeName="stroke-dashoffset" values="0;-34" dur="2.1s" repeatCount="indefinite"/></path>
    <path d="M745 66L825 138" stroke="#A78BFA"><animate attributeName="stroke-dashoffset" values="0;-34" dur="1.8s" repeatCount="indefinite"/></path>
    <path d="M745 174L825 102" stroke="#A78BFA"><animate attributeName="stroke-dashoffset" values="0;-34" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M825 102L905 138" stroke="#FF2E9A"><animate attributeName="stroke-dashoffset" values="0;-34" dur="1.4s" repeatCount="indefinite"/></path>
    <path d="M825 138L905 102" stroke="#FF2E9A"><animate attributeName="stroke-dashoffset" values="0;-34" dur="1.9s" repeatCount="indefinite"/></path>
  </g>
  <g filter="url(#glow)">
