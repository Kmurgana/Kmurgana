      <circle cx="665" cy="120" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin=".5s" repeatCount="indefinite"/></circle>
      <circle cx="665" cy="156" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#A78BFA">
      <circle cx="745" cy="66" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin=".3s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="102" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin=".8s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="138" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="745" cy="174" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#8B5CF6">
      <circle cx="825" cy="66" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="825" cy="102" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="825" cy="138" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>
      <circle cx="825" cy="174" r="4"><animate attributeName="r" values="3.5;5.5;3.5" dur="3s" begin="2.6s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#FF2E9A">
      <circle cx="905" cy="102" r="5"><animate attributeName="r" values="4.5;6.5;4.5" dur="2.4s" begin="0s" repeatCount="indefinite"/></circle>
      <circle cx="905" cy="138" r="5"><animate attributeName="r" values="4.5;6.5;4.5" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
