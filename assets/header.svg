<!-- texto -->
<text x="44" y="64" class="boot">&gt; init profile --user kmurgana<tspan fill="#00E5FF"> _<animate attributeName="opacity" values="1;0;1" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/></tspan></text>
<text x="42" y="132" class="name" filter="url(#glow)">KEVIN MURGANA</text>

<g>
  <text x="44" y="174" class="role" opacity="1">Sr. Data Scientist
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;0;.03;.22;.25;1" values="0;0;1;1;0;0"/></text>
  <text x="44" y="174" class="role" opacity="0">Machine Learning · NLP
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;.25;.28;.47;.5;1" values="0;0;1;1;0;0"/></text>
  <text x="44" y="174" class="role" opacity="0">GenAI · RAG · LLM apps
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;.5;.53;.72;.75;1" values="0;0;1;1;0;0"/></text>
