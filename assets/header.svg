    <path d="M745 138L825 66M745 138L825 102M745 138L825 138M745 138L825 174"/>
    <path d="M745 174L825 66M745 174L825 102M745 174L825 138M745 174L825 174"/>
    <path d="M825 66L905 102M825 66L905 138M825 102L905 102M825 102L905 138M825 138L905 102M825 138L905 138M825 174L905 102M825 174L905 138"/>
