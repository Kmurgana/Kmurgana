    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" keyTimes="0;.75;.78;.97;1;1" values="0;0;1;1;0;0"/></text>
</g>
<text x="44" y="210" class="geo">ARGENTINA  ·  UTC−03:00</text>
